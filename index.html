<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bPsChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 30% 20%, rgba(80, 20, 160, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(60, 10, 130, 0.06) 0%, transparent 50%);
        }

        .main-card {
            position: relative;
            z-index: 20;
            max-width: 1000px;
            width: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 3.5rem 4rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .main-card:hover {
            box-shadow: 0 40px 100px rgba(0, 0, 0, 1), 0 0 0 1px rgba(120, 60, 200, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 0.5rem;
            margin-bottom: 3rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo i {
            font-size: 2.6rem;
            color: rgba(168, 123, 255, 0.6);
            filter: drop-shadow(0 0 20px rgba(130, 60, 255, 0.05));
        }
        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
        }

        .tg-badge {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
        }
        .tg-badge a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            letter-spacing: 0.3px;
        }
        .tg-badge a i {
            font-size: 1.4rem;
            color: rgba(168, 123, 255, 0.4);
        }
        .tg-badge:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(160, 100, 255, 0.08);
        }
        .tg-badge:hover a {
            color: rgba(255, 255, 255, 0.6);
        }

        .hero {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 3rem;
            align-items: center;
        }

        .hero-text {
            flex: 2 1 340px;
        }

        .hero-text .tagline {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .hero-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.8rem;
            line-height: 1.05;
            margin-bottom: 1.2rem;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 1px;
        }

        .desc {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.25);
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 2.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
        }
        .desc span {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .desc i {
            color: rgba(168, 123, 255, 0.3);
            font-size: 0.8rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.7rem;
            margin: 2rem 0 2.8rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 0.8rem 1rem 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s ease;
        }
        .feature-item:hover {
            background: rgba(255, 255, 255, 0.025);
            border-color: rgba(160, 100, 255, 0.05);
        }
        .feature-item i {
            font-size: 1.4rem;
            color: rgba(168, 123, 255, 0.3);
            width: 1.8rem;
            text-align: center;
        }
        .feature-item .f-text {
            display: flex;
            flex-direction: column;
        }
        .feature-item .f-text strong {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
        }
        .feature-item .f-text small {
            font-weight: 300;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.5px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem 2.8rem;
            border-radius: 80px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            margin-top: 0.2rem;
        }
        .btn-download i {
            font-size: 1.4rem;
            color: rgba(168, 123, 255, 0.4);
        }
        .btn-download:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(160, 100, 255, 0.1);
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(80, 30, 180, 0.03);
            color: rgba(255, 255, 255, 0.95);
        }
        .btn-download:active {
            transform: scale(0.96);
        }

        .hero-image {
            flex: 0 1 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-badge {
            background: rgba(255, 255, 255, 0.015);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 60px rgba(80, 30, 180, 0.02);
            transition: all 0.3s ease;
        }
        .icon-badge:hover {
            border-color: rgba(160, 100, 255, 0.05);
            box-shadow: 0 0 80px rgba(80, 30, 180, 0.04);
        }
        .icon-badge i {
            font-size: 4.5rem;
            color: rgba(168, 123, 255, 0.3);
            margin-bottom: 0.4rem;
        }
        .icon-badge .label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .footer-note {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 1.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .footer-note span i {
            color: rgba(168, 123, 255, 0.1);
            margin: 0 6px;
        }
        .footer-note a {
            color: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            transition: 0.2s;
        }
        .footer-note a:hover {
            color: rgba(255, 255, 255, 0.15);
        }

        .signature {
            margin-top: 3.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .signature .ps {
            color: #4a7aff;
            text-shadow: 0 0 30px rgba(74, 122, 255, 0.15);
        }
        .signature .wallet {
            color: #ffffff;
        }
        .signature .small-sub {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 300;
            font-size: 0.7rem;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.06);
            margin-top: 0.3rem;
        }

        @media (max-width: 820px) {
            .main-card { padding: 2rem 1.5rem; border-radius: 28px; }
            .hero-text h2 { font-size: 2.8rem; }
            .btn-download { font-size: 1rem; padding: 0.9rem 2rem; width: 100%; }
            .hero-image { flex: 1 1 100%; margin-top: 0.5rem; }
            .icon-badge { width: 140px; height: 140px; }
            .icon-badge i { font-size: 3.5rem; }
            .signature { font-size: 1.6rem; }
        }
        @media (max-width: 500px) {
            .header { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
            .logo h1 { font-size: 1.8rem; }
            .hero-text h2 { font-size: 2.2rem; }
            .feature-grid { grid-template-columns: 1fr 1fr; }
            .desc { font-size: 0.95rem; flex-direction: column; gap: 0.3rem; }
            .tg-badge { padding: 0.4rem 1.2rem; }
            .tg-badge a { font-size: 0.85rem; }
            .signature { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="main-card">
        <div class="header">
            <div class="logo">
                <i class="fas fa-skull"></i>
                <h1>bPsChat</h1>
            </div>
            <div class="tg-badge">
                <a href="https://t.me/BlackSociall" target="_blank">
                    <i class="fab fa-telegram-plane"></i> 
                    <span>BlackSociall</span>
                </a>
            </div>
        </div>

        <div class="hero">
            <div class="hero-text">
                <div class="tagline">messenger</div>
                <h2>Скачай<br>мессенджер</h2>
                <div class="desc">
                    <span><i class="fas fa-crown"></i> Премиум</span>
                    <span><i class="fas fa-bolt"></i> Мгновенно</span>
                    <span><i class="fas fa-shield-halved"></i> Защита</span>
                </div>

                <div class="feature-grid">
                    <div class="feature-item">
                        <i class="fas fa-crown"></i>
                        <div class="f-text"><strong>Премиум</strong><small>подписка</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <div class="f-text"><strong>Скорость</strong><small>передача</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-lock"></i>
                        <div class="f-text"><strong>Защита</strong><small>данных</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-infinity"></i>
                        <div class="f-text"><strong>Безлимит</strong><small>свобода</small></div>
                    </div>
                </div>

                <a href="BPSchat.apk" download class="btn-download" id="downloadBtn">
                    <i class="fas fa-download"></i> Скачать APK
                </a>
                <p style="margin-top: 0.6rem; font-size: 0.65rem; opacity: 0.08; letter-spacing: 1px;">
                    версия 2.0
                </p>
            </div>

            <div class="hero-image">
                <div class="icon-badge">
                    <i class="fas fa-comet"></i>
                    <div class="label">bPs</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span><i class="fas fa-rocket"></i> bPsChat</span>
            <span><i class="fab fa-telegram"></i> <a href="https://t.me/BPSchats" target="_blank">@BPSchats</a></span>
        </div>

        <div class="signature">
            <span class="ps">Ps</span><span class="wallet">Wallet</span>
            <span class="small-sub">— created by —</span>
        </div>
    </div>

    <script>
        (function() {
            const downloadBtn = document.getElementById('downloadBtn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', function(e) {
                    console.log('Скачивание APK-файла из папки сайта');
                });
            }
        })();
    </script>
</body>
</html>
