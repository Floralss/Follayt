<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follayt — Торговая площадка игровых предметов</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <meta name="theme-color" content="#0f0e1a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' },
            dark: { 800: '#1e1b4b', 900: '#0f0e1a', 950: '#080714' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
  <noscript>
    <div style="padding:40px;text-align:center;color:#fff;font-family:sans-serif;">
      <h1>Follayt</h1>
      <p>Включите JavaScript для работы сайта.</p>
    </div>
  </noscript>

  <div id="app" class="min-h-screen flex flex-col">
    <div id="header"></div>
    <main id="main" class="flex-1 container mx-auto px-4 py-6 max-w-7xl">
      <div id="boot-message" style="text-align:center;padding:80px 20px;color:#94a3b8;">
        <div style="font-size:48px;margin-bottom:16px;">🛡️</div>
        <p style="font-size:18px;margin-bottom:8px;">Загрузка Follayt...</p>
        <p style="font-size:13px;color:#64748b;max-width:420px;margin:12px auto;">
          Если экран остаётся чёрным — откройте консоль (F12) и проверьте ошибки 404.<br><br>
          <b>Важно:</b> запускайте сервер <b>из папки follayt-app</b> (см. README или start.bat).
        </p>
      </div>
    </main>
    <div id="modals"></div>
    <div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
  </div>

  <!-- Local scripts — пути относительно index.html -->
  <script src="js/firebase.js" onerror="window.__loadError=true"></script>
  <script src="js/utils.js" onerror="window.__loadError=true"></script>
  <script src="js/auth.js" onerror="window.__loadError=true"></script>
  <script src="js/data.js" onerror="window.__loadError=true"></script>
  <script src="js/ui.js" onerror="window.__loadError=true"></script>
  <script src="js/chat.js" onerror="window.__loadError=true"></script>
  <script src="js/admin.js" onerror="window.__loadError=true"></script>
  <script src="js/app.js" onerror="window.__loadError=true"></script>

  <script>
    // Fallback if any local script failed to load (404)
    setTimeout(function () {
      if (window.__loadError || typeof renderApp !== 'function') {
        var el = document.getElementById('boot-message');
        if (el) {
          el.innerHTML = `
            <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
            <p style="font-size:18px;color:#f87171;margin-bottom:12px;">Не удалось загрузить скрипты (ошибка 404)</p>
            <div style="text-align:left;max-width:480px;margin:0 auto;background:#1e1b4b;padding:20px;border-radius:12px;font-size:14px;line-height:1.6;">
              <p style="margin-bottom:10px;"><b>Как исправить:</b></p>
              <ol style="padding-left:20px;margin:0;">
                <li style="margin-bottom:6px;">Распакуйте архив полностью.</li>
                <li style="margin-bottom:6px;">Откройте терминал / cmd <b>внутри папки <code>follayt-app</code></b>.</li>
                <li style="margin-bottom:6px;">Запустите:
                  <pre style="background:#0f0e1a;padding:10px;border-radius:8px;margin-top:6px;overflow-x:auto;">npx serve .
                  или
                  python -m http.server 8080</pre>
                </li>
                <li>Либо дважды кликните <b>start.bat</b> (Windows).</li>
              </ol>
              <p style="margin-top:14px;color:#94a3b8;font-size:13px;">Не открывайте index.html просто двойным кликом (file://) — некоторые браузеры блокируют скрипты.</p>
            </div>
          `;
        }
      }
    }, 1500);
  </script>
</body>
</html>
