<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follayt — Торговая площадка игровых предметов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' },
            dark: { 800: '#1e1b4b', 900: '#0f0e1a', 950: '#080714' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Firebase SDK (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-dark-950 text-gray-100 min-h-screen">
  <!-- App container -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header will be injected -->
    <div id="header"></div>
    <!-- Main content -->
    <main id="main" class="flex-1 container mx-auto px-4 py-6 max-w-7xl"></main>
    <!-- Modals -->
    <div id="modals"></div>
    <!-- Toast notifications -->
    <div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
