<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Izbrannik Star</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="user-block">
        <div class="avatar" id="avatar">?</div>
        <div class="user-info">
          <div class="username" id="username">...</div>
          <div class="balance-row">
            <svg class="ico-star" viewBox="0 0 24 24" width="13" height="13"><path fill="#f0c14b" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span id="balanceStars">0</span>
          </div>
        </div>
      </div>
      <button class="btn-deposit" id="btnDeposit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Пополнить
      </button>
    </header>

    <!-- Content -->
    <main class="content" id="content">
      <section id="tab-cases" class="tab active">
        <div class="section-head">
          <h2>Кейсы</h2>
        </div>
        <div class="cases-grid" id="casesGrid"></div>
      </section>

      <section id="tab-games" class="tab">
        <div class="section-head"><h2>Игры</h2></div>
        <div class="games-list" id="gamesList">
          <div class="game-banner" data-game="roulette">
            <div class="gb-bg gb-roulette"></div>
            <div class="gb-content">
              <div class="gb-title">РУЛЕТКА</div>
              <div class="gb-desc">Красное · Чёрное · Зелёное</div>
            </div>
            <button class="gb-play">Играть</button>
          </div>
          <div class="game-banner" data-game="upgrade">
            <div class="gb-bg gb-upgrade"></div>
            <div class="gb-content">
              <div class="gb-title">АПГРЕЙД</div>
              <div class="gb-desc">Увеличь свою ставку</div>
            </div>
            <button class="gb-play">Играть</button>
          </div>
          <div class="game-banner" data-game="crash">
            <div class="gb-bg gb-crash"></div>
            <div class="gb-content">
              <div class="gb-title">КРАШ</div>
              <div class="gb-desc">Выйди вовремя</div>
            </div>
            <button class="gb-play">Играть</button>
          </div>
        </div>
      </section>

      <section id="tab-inventory" class="tab">
        <div class="section-head"><h2>Инвентарь</h2></div>
        <div class="inventory-grid" id="inventoryGrid">
          <div class="empty-state">Пока пусто. Открой кейс!</div>
        </div>
      </section>

      <section id="tab-profile" class="tab">
        <div class="section-head"><h2>Профиль</h2></div>
        <div class="profile-card" id="profileCard"></div>
      </section>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="bn-btn active" data-tab="cases">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4M8 8l4-4 4 4"/></svg>
        <span>Кейсы</span>
      </button>
      <button class="bn-btn" data-tab="games">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h2"/></svg>
        <span>Игры</span>
      </button>
      <button class="bn-btn" data-tab="inventory">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Инвентарь</span>
      </button>
      <button class="bn-btn" data-tab="profile">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Профиль</span>
      </button>
    </nav>

    <!-- Case preview modal -->
    <div class="sheet" id="sheetCase">
      <div class="sheet-backdrop" data-close="sheetCase"></div>
      <div class="sheet-body">
        <div class="sheet-handle"></div>
        <div class="case-preview-head">
          <div class="cp-icon" id="cpIcon"></div>
          <div>
            <div class="cp-name" id="cpName"></div>
            <div class="cp-desc" id="cpDesc"></div>
          </div>
        </div>
        <div class="cp-price" id="cpPrice"></div>
        <div class="cp-label">Что может выпасть</div>
        <div class="cp-prizes" id="cpPrizes"></div>
        <button class="btn-main" id="btnDoOpen" disabled>Открыть</button>
      </div>
    </div>

    <!-- Spin overlay -->
    <div class="spin-overlay" id="spinOverlay">
      <div class="spin-title">Открываем кейс</div>
      <div class="spin-track-wrap">
        <div class="spin-pointer"></div>
        <div class="spin-track" id="spinTrack"></div>
      </div>
      <div class="spin-hint">Удачи!</div>
    </div>

    <!-- Result modal -->
    <div class="modal" id="modalResult">
      <div class="modal-card result-card">
        <div class="result-glow" id="resultGlow"></div>
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-name" id="resultName"></div>
        <div class="result-value" id="resultValue"></div>
        <button class="btn-main" id="btnCloseResult">Забрать</button>
      </div>
    </div>

    <!-- Game modal -->
    <div class="modal" id="modalGame">
      <div class="modal-card">
        <button class="modal-x" id="btnCloseGame">✕</button>
        <h3 id="gameTitle">Игра</h3>
        <div id="gameBody"></div>
      </div>
    </div>

    <!-- Deposit modal -->
    <div class="modal" id="modalDeposit">
      <div class="modal-card">
        <button class="modal-x" id="btnCloseDeposit">✕</button>
        <h3>Пополнение</h3>
        <p class="hint">Минимум 10 ★</p>
        <div class="form-stack">
          <input type="number" id="depositAmount" value="100" min="10" />
          <div class="presets">
            <button class="preset" data-amt="50">50</button>
            <button class="preset" data-amt="100">100</button>
            <button class="preset" data-amt="250">250</button>
            <button class="preset" data-amt="500">500</button>
          </div>
          <button class="btn-main" id="btnDoDeposit">Пополнить ★</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <!-- Firebase deferred for speed -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
