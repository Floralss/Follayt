<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Izbrannik Gift</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="user-block">
        <div class="avatar" id="avatar">?</div>
        <div class="user-info">
          <div class="username" id="username">Загрузка...</div>
          <div class="balance"><span id="balanceStars">0</span> ⭐</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnDeposit">+</button>
        <button class="btn-icon" id="btnInventory">🎒</button>
        <button class="btn-icon" id="btnAdmin" style="display:none">👑</button>
      </div>
    </header>

    <nav class="nav">
      <button class="nav-btn active" data-tab="cases">Кейсы</button>
      <button class="nav-btn" data-tab="games">Игры</button>
      <button class="nav-btn" data-tab="inventory">Инвентарь</button>
    </nav>

    <main class="content">
      <section id="tab-cases" class="tab active">
        <h2 class="section-title">Кейсы</h2>
        <div class="cases-grid" id="casesGrid"></div>
      </section>
      <section id="tab-games" class="tab">
        <h2 class="section-title">Игры</h2>
        <div class="games-list">
          <div class="game-card" data-game="roulette">
            <div class="game-icon">🎰</div>
            <div class="game-info"><div class="game-name">Рулетка</div><div class="game-desc">Красное / Чёрное / Зелёное</div></div>
            <button class="btn-play">Играть</button>
          </div>
          <div class="game-card" data-game="upgrade">
            <div class="game-icon">⬆️</div>
            <div class="game-info"><div class="game-name">Апгрейд</div><div class="game-desc">Увеличь ставку</div></div>
            <button class="btn-play">Играть</button>
          </div>
          <div class="game-card" data-game="crash">
            <div class="game-icon">🚀</div>
            <div class="game-info"><div class="game-name">Краш</div><div class="game-desc">Выйди вовремя</div></div>
            <button class="btn-play">Играть</button>
          </div>
        </div>
      </section>
      <section id="tab-inventory" class="tab">
        <h2 class="section-title">Инвентарь</h2>
        <div class="inventory-grid" id="inventoryGrid"><div class="empty-state">Пока пусто</div></div>
      </section>
    </main>

    <div class="open-overlay" id="openOverlay">
      <div class="open-box">🎁</div>
      <div class="open-text">Открываем...</div>
    </div>

    <div class="modal" id="modalResult">
      <div class="modal-content">
        <div class="prize-image" id="prizeImage">🎁</div>
        <div class="prize-name" id="prizeName">Приз</div>
        <div class="prize-value" id="prizeValue">0 ⭐</div>
        <button class="btn-primary" id="btnCloseResult">Отлично</button>
      </div>
    </div>

    <div class="modal" id="modalGame">
      <div class="modal-content game-modal">
        <button class="modal-close" id="btnCloseGame">✕</button>
        <h3 id="gameTitle">Игра</h3>
        <div id="gameBody"></div>
      </div>
    </div>

    <div class="modal" id="modalDeposit">
      <div class="modal-content">
        <button class="modal-close" id="btnCloseDeposit">✕</button>
        <h3>Пополнение</h3>
        <div class="game-form" style="margin-top:12px">
          <label>Сумма</label>
          <input type="number" id="depositAmount" value="100" min="10"/>
          <button class="btn-primary" id="btnDoDeposit">Пополнить</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modalAdmin">
      <div class="modal-content game-modal">
        <button class="modal-close" id="btnCloseAdmin">✕</button>
        <h3>Админ</h3>
        <div id="adminBody"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
