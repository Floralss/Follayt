<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bPsChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0000;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Яркий фон с красным свечением */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 0, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 50, 0, 0.05) 0%, transparent 70%);
        }

        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff1a1a, 0 0 30px #ff1a1a;
            animation: floatParticle linear infinite;
            opacity: 0.4;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .main-card {
            position: relative;
            z-index: 20;
            max-width: 1100px;
            width: 100%;
            background: rgba(10, 0, 0, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 3.5rem 4rem;
            border: 1px solid rgba(255, 50, 50, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.05);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-card:hover {
            box-shadow: 0 40px 100px rgba(0, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.08);
            border-color: rgba(255, 50, 50, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 0.5rem;
            margin-bottom: 3rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 50, 50, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.3));
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(255, 0, 0, 0.7));
            }
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ffffff 0%, #ff4444 50%, #ff0000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.1);
        }

        .tg-badge {
            background: rgba(255, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 50, 50, 0.15);
            transition: all 0.3s ease;
        }
        .tg-badge a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            letter-spacing: 0.3px;
        }
        .tg-badge a i {
            font-size: 1.4rem;
            color: rgba(255, 80, 80, 0.6);
        }
        .tg-badge:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
        }
        .tg-badge:hover a {
            color: rgba(255, 255, 255, 0.8);
        }

        .hero {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 3rem;
            align-items: center;
        }

        .hero-text {
            flex: 2 1 340px;
        }

        .hero-text .tagline {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 6px;
            color: rgba(255, 80, 80, 0.3);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            animation: glowText 3s ease-in-out infinite;
        }

        @keyframes glowText {
            0%, 100% {
                color: rgba(255, 80, 80, 0.3);
            }
            50% {
                color: rgba(255, 80, 80, 0.7);
            }
        }

        .hero-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.8rem;
            line-height: 1.05;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #ffffff 20%, #ff5555 60%, #ff0000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 80px rgba(255, 0, 0, 0.05);
        }

        .desc {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.35);
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 2.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
        }
        .desc span {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 0, 0.05);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 50, 50, 0.06);
            transition: all 0.3s ease;
        }
        .desc span:hover {
            border-color: rgba(255, 50, 50, 0.2);
            background: rgba(255, 0, 0, 0.1);
        }
        .desc i {
            color: rgba(255, 80, 80, 0.5);
            font-size: 0.8rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.7rem;
            margin: 2rem 0 2.8rem;
        }

        .feature-item {
            background: rgba(255, 0, 0, 0.03);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 0.8rem 1rem 0.8rem 1.2rem;
            border: 1px solid rgba(255, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .feature-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.08), transparent);
            transition: left 0.5s ease;
        }
        .feature-item:hover::before {
            left: 100%;
        }
        .feature-item:hover {
            background: rgba(255, 0, 0, 0.08);
            border-color: rgba(255, 50, 50, 0.15);
            transform: translateX(4px);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.03);
        }
        .feature-item i {
            font-size: 1.4rem;
            color: rgba(255, 80, 80, 0.5);
            width: 1.8rem;
            text-align: center;
        }
        .feature-item .f-text {
            display: flex;
            flex-direction: column;
        }
        .feature-item .f-text strong {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.3px;
        }
        .feature-item .f-text small {
            font-weight: 300;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.1), rgba(180, 0, 0, 0.05));
            border: 1px solid rgba(255, 50, 50, 0.15);
            padding: 1rem 2.8rem;
            border-radius: 80px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 0, 0, 0.03);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            margin-top: 0.2rem;
            position: relative;
            overflow: hidden;
        }
        .btn-download::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.05) 0%, transparent 70%);
            animation: rotateGlow 4s linear infinite;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .btn-download i {
            font-size: 1.4rem;
            color: rgba(255, 80, 80, 0.6);
            z-index: 1;
        }
        .btn-download span {
            z-index: 1;
        }
        .btn-download:hover {
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.2), rgba(200, 0, 0, 0.1));
            border-color: rgba(255, 50, 50, 0.3);
            transform: scale(1.03);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 50px rgba(255, 0, 0, 0.08);
            color: #ffffff;
        }
        .btn-download:active {
            transform: scale(0.96);
        }

        .version-selector {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0 1rem;
            flex-wrap: wrap;
        }

        .version-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 50, 50, 0.08);
            background: rgba(255, 0, 0, 0.03);
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .version-btn i {
            font-size: 1.2rem;
            color: rgba(255, 80, 80, 0.3);
        }
        .version-btn:hover {
            border-color: rgba(255, 50, 50, 0.2);
            background: rgba(255, 0, 0, 0.06);
            color: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
        }
        .version-btn.active {
            border-color: rgba(255, 50, 50, 0.3);
            background: rgba(255, 0, 0, 0.1);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.05);
        }
        .version-btn.active i {
            color: #ff4444;
        }

        .hero-image {
            flex: 0 1 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-badge {
            background: rgba(255, 0, 0, 0.03);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 50, 50, 0.06);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.02);
            transition: all 0.3s ease;
            animation: floatBadge 4s ease-in-out infinite;
        }
        @keyframes floatBadge {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .icon-badge:hover {
            border-color: rgba(255, 50, 50, 0.12);
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.04);
        }
        .icon-badge i {
            font-size: 4.5rem;
            color: rgba(255, 80, 80, 0.35);
            margin-bottom: 0.4rem;
        }
        .icon-badge .label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .signature-block {
            text-align: center;
            margin-top: 1.2rem;
            padding-top: 1rem;
        }
        .signature-block .pswallet {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .signature-block .pswallet .ps {
            color: #ff1a1a;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        .signature-block .pswallet .wallet {
            color: #ffffff;
        }
        .signature-block .small-sub {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 300;
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 0.2rem;
        }

        .footer-note {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 0, 0, 0.04);
            padding-top: 1.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .footer-note span i {
            color: rgba(255, 50, 50, 0.15);
            margin: 0 6px;
        }
        .footer-note a {
            color: rgba(255, 255, 255, 0.1);
            text-decoration: none;
            transition: 0.2s;
        }
        .footer-note a:hover {
            color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 820px) {
            .main-card { padding: 2rem 1.5rem; border-radius: 28px; }
            .hero-text h2 { font-size: 2.8rem; }
            .btn-download { font-size: 1rem; padding: 0.9rem 2rem; width: 100%; }
            .hero-image { flex: 1 1 100%; margin-top: 0.5rem; }
            .icon-badge { width: 140px; height: 140px; }
            .icon-badge i { font-size: 3.5rem; }
            .version-selector { width: 100%; }
            .version-btn { flex: 1; justify-content: center; }
            .signature-block .pswallet { font-size: 1.4rem; }
        }
        @media (max-width: 500px) {
            .header { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
            .logo h1 { font-size: 1.8rem; }
            .hero-text h2 { font-size: 2.2rem; }
            .feature-grid { grid-template-columns: 1fr 1fr; }
            .desc { font-size: 0.95rem; flex-direction: column; gap: 0.3rem; }
            .tg-badge { padding: 0.4rem 1.2rem; }
            .tg-badge a { font-size: 0.85rem; }
            .signature-block .pswallet { font-size: 1.1rem; letter-spacing: 2px; }
            .version-selector { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>
    <div class="bg-glow"></div>

    <div class="main-card">
        <div class="header">
            <div class="logo">
                <img src="photo.jpg" alt="bPsChat Logo">
                <h1>bPsChat</h1>
            </div>
            <div class="tg-badge">
                <a href="https://t.me/BlackSociall" target="_blank">
                    <i class="fab fa-telegram-plane"></i>
                    <span>BlackSociall</span>
                </a>
            </div>
        </div>

        <div class="hero">
            <div class="hero-text">
                <div class="tagline">▸ messenger ▸</div>
                <h2>Скачай<br>мессенджер</h2>
                <div class="desc">
                    <span><i class="fas fa-crown"></i> Премиум</span>
                    <span><i class="fas fa-bolt"></i> Мгновенно</span>
                    <span><i class="fas fa-shield-halved"></i> Защита</span>
                </div>

                <div class="feature-grid">
                    <div class="feature-item">
                        <i class="fas fa-crown"></i>
                        <div class="f-text"><strong>Премиум</strong><small>подписка</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <div class="f-text"><strong>Скорость</strong><small>передача</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-lock"></i>
                        <div class="f-text"><strong>Защита</strong><small>данных</small></div>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-infinity"></i>
                        <div class="f-text"><strong>Безлимит</strong><small>свобода</small></div>
                    </div>
                </div>

                <div class="version-selector">
                    <a href="#" class="version-btn active" id="mobileBtn">
                        <i class="fas fa-mobile-screen-button"></i> Mobile
                    </a>
                    <a href="#" class="version-btn" id="pcBtn">
                        <i class="fas fa-desktop"></i> PC (скоро)
                    </a>
                </div>

                <a href="app.apk" download class="btn-download" id="downloadBtn">
                    <i class="fas fa-download"></i>
                    <span>Скачать APK</span>
                </a>
                <p style="margin-top: 0.4rem; font-size: 0.65rem; opacity: 0.1; letter-spacing: 1px;">
                    версия 2.0
                </p>

                <div class="signature-block">
                    <div class="pswallet">
                        <span class="ps">Ps</span><span class="wallet">Wallet</span>
                    </div>
                    <div class="small-sub">— created by —</div>
                </div>
            </div>

            <div class="hero-image">
                <div class="icon-badge">
                    <i class="fas fa-comet"></i>
                    <div class="label">bPs</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span><i class="fas fa-rocket"></i> bPsChat</span>
            <span><i class="fab fa-telegram"></i> <a href="https://t.me/BlackSociall" target="_blank">@BlackSociall</a></span>
        </div>
    </div>

    <script>
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 40;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 5 + 2) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
                particle.style.animationDelay = (Math.random() * 12) + 's';
                particle.style.opacity = Math.random() * 0.4 + 0.1;
                container.appendChild(particle);
            }
        })();

        const mobileBtn = document.getElementById('mobileBtn');
        const pcBtn = document.getElementById('pcBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        mobileBtn.addEventListener('click', function(e) {
            e.preventDefault();
            mobileBtn.classList.add('active');
            pcBtn.classList.remove('active');
            downloadBtn.href = 'app.apk';
            downloadBtn.innerHTML = '<i class="fas fa-download"></i><span>Скачать APK</span>';
            downloadBtn.style.cursor = 'pointer';
        });

        pcBtn.addEventListener('click', function(e) {
            e.preventDefault();
            pcBtn.classList.add('active');
            mobileBtn.classList.remove('active');
            downloadBtn.href = '#';
            downloadBtn.innerHTML = '<i class="fas fa-clock"></i><span>Скоро</span>';
            downloadBtn.style.cursor = 'default';
        });
    </script>
</body>
</html>
